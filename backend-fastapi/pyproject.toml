[project]
name = "backend-fastapi"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]",
    "sqlalchemy",
    "sqlalchemy[asyncio]",
    "alembic",
    "psycopg2-binary",
    "asyncpg",
    "pydantic-settings",
    "python-dotenv",
    "pwdlib[argon2]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff.lint]
ignore = ["B008"]